apply plugin: 'com.android.application'
android {
  namespace 'com.fo.castbox'
  compileSdk 34
  defaultConfig { applicationId 'com.fo.castbox'; minSdk 24; targetSdk 34; versionCode 3; versionName '1.2' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  signingConfigs {
    release {
      storeFile file('../castbox.keystore')
      storePassword 'castbox2026'
      keyAlias 'castbox'
      keyPassword 'castbox2026'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'
}
